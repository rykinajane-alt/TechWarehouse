
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Техника</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #253b5b;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        h1 { margin-top: 0; color: #203e70; }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .error {
            display: block;
            margin-top: 5px;
            color: #b84242;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        button, .button {
            display: inline-block;
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            background: #345f9e;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .secondary { background: #68778d; }
    </style>
</head>

<body>
<div class="container">

    <h1 th:text="${pageTitle}">Добавление техники</h1>

    <form th:action="@{/equipment/save}"
          th:object="${equipment}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="equipmentType">Вид техники</label>
            <input type="text"
                   id="equipmentType"
                   th:field="*{equipmentType}"
                   placeholder="Например, ноутбук">

            <span class="error"
                  th:if="${#fields.hasErrors('equipmentType')}"
                  th:errors="*{equipmentType}"></span>
        </div>

        <div class="form-group">
            <label for="equipmentGroup">Группа техники</label>
            <input type="text"
                   id="equipmentGroup"
                   th:field="*{equipmentGroup}"
                   placeholder="Например, компьютеры">

            <span class="error"
                  th:if="${#fields.hasErrors('equipmentGroup')}"
                  th:errors="*{equipmentGroup}"></span>
        </div>

        <div class="form-group">
            <label for="arrivalDate">Дата ввоза</label>
            <input type="date"
                   id="arrivalDate"
                   th:field="*{arrivalDate}">

            <span class="error"
                  th:if="${#fields.hasErrors('arrivalDate')}"
                  th:errors="*{arrivalDate}"></span>
        </div>

        <div class="form-group">
            <label for="dispatchDate">Дата вывоза</label>
            <input type="date"
                   id="dispatchDate"
                   th:field="*{dispatchDate}">

            <small>Оставь поле пустым, если техника ещё не вывезена.</small>
        </div>

        <div class="form-group">
            <label for="driverFullName">ФИО водителя</label>
            <input type="text"
                   id="driverFullName"
                   th:field="*{driverFullName}"
                   placeholder="Введите ФИО водителя">

            <span class="error"
                  th:if="${#fields.hasErrors('driverFullName')}"
                  th:errors="*{driverFullName}"></span>
        </div>

        <div class="form-group">
            <label for="quantity">Количество единиц техники</label>
            <input type="number"
                   id="quantity"
                   th:field="*{quantity}"
                   min="0"
                   placeholder="Введите количество">

            <span class="error"
                  th:if="${#fields.hasErrors('quantity')}"
                  th:errors="*{quantity}"></span>
        </div>

        <div class="buttons">
            <button type="submit">Сохранить</button>
            <a th:href="@{/equipment}" class="button secondary">
                Назад
            </a>
        </div>

    </form>
</div>
</body>
</html>
