
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Склад магазина техники</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #253b5b;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
    }

    h1 {
      margin-top: 0;
      color: #203e70;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }

    .toolbar form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    input, select {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }

    button, .button {
      display: inline-block;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: #345f9e;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }

    button:hover, .button:hover {
      background: #254e87;
    }

    .secondary {
      background: #68778d;
    }

    .secondary:hover {
      background: #526176;
    }

    .danger {
      background: #b84242;
    }

    .danger:hover {
      background: #963333;
    }

    .logout-form {
      margin: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px 10px;
      border: 1px solid #d5deea;
      text-align: left;
    }

    th {
      background: #eaf0f8;
      color: #203e70;
    }

    tbody tr:nth-child(even) {
      background: #f7f9fc;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .actions form {
      margin: 0;
    }

    .success {
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 6px;
      background: #e4f5e8;
      color: #236b36;
    }

    .empty {
      text-align: center;
      color: #64748b;
    }

    .count {
      margin-top: 16px;
      color: #64748b;
    }

    @media (max-width: 800px) {
      .container {
        padding: 15px;
        overflow-x: auto;
      }

      table {
        min-width: 950px;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>Склад магазина техники</h1>

    <!-- Выход из учётной записи -->
    <form th:action="@{/logout}" method="post" class="logout-form">
      <button type="submit" class="secondary">
        Выйти
      </button>
    </form>
  </div>

  <!-- Сообщение об успешном действии -->
  <div class="success"
       th:if="${successMessage}"
       th:text="${successMessage}">
  </div>

  <div class="toolbar">

    <!-- Поиск и сортировка -->
    <form th:action="@{/equipment}" method="get">
      <input
              type="text"
              name="keyword"
              placeholder="Поиск по виду или группе техники"
              th:value="${keyword}">

      <select name="sortDir">
        <option value="asc"
                th:selected="${sortDir == 'asc'}">
          По возрастанию
        </option>

        <option value="desc"
                th:selected="${sortDir == 'desc'}">
          По убыванию
        </option>
      </select>

      <button type="submit">Найти</button>

      <a th:href="@{/equipment}" class="button secondary">
        Сбросить
      </a>
    </form>

    <!-- Добавление техники -->
    <a th:href="@{/equipment/new}" class="button">
      Добавить технику
    </a>

    <!-- Статистика отгрузок -->
    <a th:href="@{/equipment/statistics}"
       class="button secondary">
      Статистика отгрузок
    </a>

  </div>

  <!-- Таблица техники -->
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Вид техники</th>
      <th>Группа техники</th>
      <th>Дата ввоза</th>
      <th>Дата вывоза</th>
      <th>ФИО водителя</th>
      <th>Количество</th>
      <th>Действия</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${equipmentList}">
      <td th:text="${item.id}"></td>

      <td th:text="${item.equipmentType}"></td>

      <td th:text="${item.equipmentGroup}"></td>

      <td th:text="${item.arrivalDate != null
          ? #temporals.format(item.arrivalDate, 'dd.MM.yyyy')
          : '—'}">
      </td>

      <td th:text="${item.dispatchDate != null
          ? #temporals.format(item.dispatchDate, 'dd.MM.yyyy')
          : '—'}">
      </td>

      <td th:text="${item.driverFullName}"></td>

      <td th:text="${item.quantity}"></td>

      <td>
        <div class="actions">

          <!-- Редактирование -->
          <a th:href="@{/equipment/edit/{id}(id=${item.id})}"
             class="button">
            Изменить
          </a>

          <!-- Удаление -->
          <form
                  th:action="@{/equipment/delete/{id}(id=${item.id})}"
                  method="post"
                  onsubmit="return confirm('Удалить эту запись?');">

            <button type="submit" class="danger">
              Удалить
            </button>

          </form>

        </div>
      </td>
    </tr>

    <!-- Сообщение при отсутствии записей -->
    <tr th:if="${#lists.isEmpty(equipmentList)}">
      <td colspan="8" class="empty">
        Записи не найдены
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Общее количество записей -->
  <div class="count">
    Общее количество записей:
    <strong th:text="${recordCount}">0</strong>
  </div>

</div>
</body>
</html>
