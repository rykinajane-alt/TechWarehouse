
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Склад магазина техники</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f4f9;
            font-family: Arial, sans-serif;
            color: #17365d;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 25px;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #68778d;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            margin-bottom: 18px;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #315fa5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #244a83;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #fce8e8;
            color: #a12626;
        }

        .success {
            background: #e6f4ea;
            color: #246b38;
        }
    </style>
</head>

<body>
<div class="login-card">
    <h1>Склад магазина техники</h1>
    <p class="subtitle">Войдите в систему</p>

    <div class="message" th:if="${param.error}">
        Неверный логин или пароль.
    </div>

    <div class="message success" th:if="${param.logout}">
        Вы успешно вышли из системы.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Логин</label>
        <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus>

        <label for="password">Пароль</label>
        <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>

        <button type="submit">Войти</button>
    </form>
</div>
</body>
</html>
